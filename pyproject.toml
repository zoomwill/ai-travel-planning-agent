[project]
name = "ai-travel-planner"
version = "0.1.0"
description = "Beginner-friendly reconstruction of a multi-agent travel planning system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.134,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "httpx>=0.27,<1.0",
    "loguru>=0.7,<1.0",
    "prometheus-client>=0.21,<1.0",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "psycopg[binary]>=3.3.4,<4",
    "redis>=8.0.1,<9",
    "chromadb-client==1.5.9",
    "numpy>=2.4.6,<2.5",
    "langgraph>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.7.0",
    "fastmcp>=3.4,<4",
    "langchain-mcp-adapters>=0.3,<0.4",
    "openai>=3.3.1",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires explicitly enabled local Docker infrastructure",
    "observability: requires RUN_OBSERVABILITY_TESTS=1 and the local P13 stack",
    "llm_integration: requires RUN_LLM_INTEGRATION_TESTS=1 and a real Qwen API key",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
