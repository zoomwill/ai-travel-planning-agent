apiVersion: 1

providers:
  - name: Travel Planner Provisioned Dashboards
    orgId: 1
    folder: Travel Planner
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
